<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>燕云十六声关系图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3eee2; --paper:#faf6ec; --paper2:#efe7d3; --ink:#1f2a26; --ink2:#4a5a53; --muted:#7a847c;
    --line:#ddd2b8; --card:#fffdf6; --shadow:0 10px 30px rgba(31,42,38,.10);
    --xiayuan:#c94f6d; --xiayuan-bg:#fbe9ee;
    --shitu:#2f7d7a; --shitu-bg:#e2f0ee;
    --jieyi:#b07d1e; --jieyi-bg:#f7ecd2;
    --accent:#9a2b2e;
    --hero-ink:#16201d;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101614; --paper:#171f1c; --paper2:#1d2823; --ink:#ece5d3; --ink2:#c6cbbd; --muted:#8f9a92;
      --line:#33413a; --card:#1a2420; --shadow:0 10px 30px rgba(0,0,0,.35);
      --xiayuan:#f08aa3; --xiayuan-bg:#3a232c;
      --shitu:#6fc2bb; --shitu-bg:#1c3331;
      --jieyi:#e3b959; --jieyi-bg:#38301c;
      --accent:#e08a7a;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
  h1,h2,h3,.serif{font-family:"Noto Serif SC","Songti SC","STSong",serif}
  a{color:var(--shitu)}
  button{font:inherit;cursor:pointer;min-height:44px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 18px 56px}

  /* ---------- Hero ---------- */
  .hero{position:relative;margin:0 calc(50% - 50vw);overflow:hidden;background:var(--hero-ink)}
  .hero img{width:100%;height:300px;object-fit:cover;object-position:center 42%;display:block;opacity:.92}
  .hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,18,15,.72) 0%,rgba(10,18,15,.38) 46%,rgba(10,18,15,.05) 78%),linear-gradient(to top,rgba(10,18,15,.55),transparent 55%)}
  .hero-inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;max-width:1120px;margin:0 auto;padding:22px 18px 26px;width:100%}
  .hero .game{color:#e9d9a8;font-size:13px;letter-spacing:.42em;font-weight:700}
  .hero h1{margin:6px 0 6px;color:#fdf8ea;font-size:clamp(30px,5.2vw,48px);line-height:1.15;font-weight:900;text-shadow:0 2px 18px rgba(0,0,0,.35)}
  .hero p{margin:0;color:#e8e2cf;max-width:560px;font-size:15px}
  .hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .hero-meta span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(253,248,234,.35);border-radius:999px;color:#fdf8ea;font-size:13px;background:rgba(10,18,15,.35);backdrop-filter:blur(3px)}
  .seal{position:absolute;top:20px;right:22px;width:52px;height:52px;border-radius:8px;background:#9a2b2e;color:#fdf3e3;display:grid;place-items:center;font-family:"Noto Serif SC",serif;font-weight:900;font-size:15px;line-height:1.15;text-align:center;transform:rotate(4deg);box-shadow:0 6px 16px rgba(0,0,0,.35);padding:4px}
  @media(max-width:640px){.hero img{height:250px}.seal{display:none}}

  /* ---------- Toolbar ---------- */
  .toolbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:14px 0 10px;margin-bottom:6px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .filters .label{font-size:13px;color:var(--muted);margin-right:2px}
  .fbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .fbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .fbtn[data-f="xiayuan"] .dot{background:var(--xiayuan)} .fbtn[data-f="shitu"] .dot{background:var(--shitu)} .fbtn[data-f="jieyi"] .dot{background:var(--jieyi)}
  .fbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .fbtn[data-f="xiayuan"][aria-pressed="true"]{background:var(--xiayuan);border-color:var(--xiayuan);color:#fff}
  .fbtn[data-f="shitu"][aria-pressed="true"]{background:var(--shitu);border-color:var(--shitu);color:#fff}
  .fbtn[data-f="jieyi"][aria-pressed="true"]{background:var(--jieyi);border-color:var(--jieyi);color:#fff}
  .fbtn[aria-pressed="true"] .dot{background:#fff}
  .hint{font-size:13px;color:var(--muted);margin:8px 2px 0}

  /* ---------- Graph ---------- */
  .graph-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:190px}
  section{scroll-margin-top:190px}
  .graph-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:baseline;padding:16px 20px 4px}
  .graph-head h2{margin:0;font-size:21px;font-weight:900}
  .graph-head .sub{font-size:13px;color:var(--muted)}
  .legend{display:flex;flex-wrap:wrap;gap:14px;padding:8px 20px 2px;font-size:13px;color:var(--ink2)}
  .legend i{display:inline-block;width:26px;height:0;vertical-align:middle;margin-right:6px}
  .legend .l-xiayuan{border-top:3px solid var(--xiayuan);border-radius:3px}
  .legend .l-shitu{border-top:3px solid transparent;border-image:linear-gradient(90deg,#9a2b2e,#b7791f,#2e6b6b,#2f5d8a,#6b4a8a) 1}
  .legend .l-jieyi{border-top:3px dashed var(--jieyi)}
  .stage{position:relative;width:100%;aspect-ratio:940/580;min-height:480px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  .stage.panning{cursor:grabbing}
  .world{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
  .world.anim{transition:transform .45s cubic-bezier(.25,.8,.3,1)}
  .stage svg{position:absolute;inset:0;width:100%;height:100%}
  .zoom-out .edge-label{display:none}
  .zoom-out .node .ptag{display:none}
  .node.pulse .avatar{animation:pulse 1.5s ease-out}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(154,43,46,.55)}100%{box-shadow:0 0 0 22px rgba(154,43,46,0)}}
  .zoomctl{position:absolute;right:12px;bottom:12px;z-index:6;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
  .zoomctl button{min-height:36px;min-width:36px;border:none;background:var(--paper2);color:var(--ink);border-radius:999px;font-weight:800;font-size:16px;line-height:1;padding:0 10px}
  .zoomctl button.txt{font-size:12.5px}
  .zoomctl .zval{font-size:12.5px;color:var(--muted);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
  .searchrow{position:relative;margin-top:10px;max-width:640px}
  .searchrow input{width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);padding:12px 48px 12px 20px;font:inherit;font-size:17px;outline:none}
  .searchrow input:focus{border-color:var(--shitu)}
  .searchrow .clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);min-height:34px;min-width:34px;border:none;border-radius:50%;background:var(--paper2);color:var(--ink2);font-size:15px;display:none}
  .searchrow.hasq .clear{display:block}
  .sresults{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:40;display:none}
  .sresults.open{display:block}
  .sresults button{display:flex;width:100%;align-items:center;gap:10px;border:none;background:none;color:var(--ink);padding:10px 14px;text-align:left;min-height:44px;font-size:14.5px}
  .sresults button:hover,.sresults button.active{background:var(--paper2)}
  .sresults .sav{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Noto Serif SC",serif;font-weight:900;font-size:14px}
  .sresults .srole{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap}
  .sresults .none{padding:12px 14px;color:var(--muted);font-size:14px}
  .graph-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 20px 4px}
  .graph-actions .focus-label{font-size:13.5px;color:var(--ink2);font-weight:700;margin-right:auto}
  .gbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 15px;font-weight:700;font-size:13.5px;min-height:38px}
  .gbtn:hover{border-color:var(--ink)}
  .pcard.hidden-by-search{display:none}
  .edge{fill:none;stroke-width:3;stroke-linecap:round;transition:opacity .2s}
  .edge.xiayuan{stroke:var(--xiayuan)} .edge.shitu{stroke:var(--shitu)} .edge.jieyi{stroke:var(--jieyi);stroke-dasharray:9 7}
  .edge.dim{opacity:.35} .edge.hl{stroke-width:4.5}
  .edge-label{font-size:12.5px;font-weight:700;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;transition:opacity .2s}
  .edge-label.xiayuan{fill:var(--xiayuan)} .edge-label.shitu{fill:var(--shitu)} .edge-label.jieyi{fill:var(--jieyi)}
  .edge-label.dim{opacity:.35}
  .node{position:absolute;transform:translate(-50%,-50%);background:none;border:none;padding:6px;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:3;transition:opacity .2s;min-height:0}
  .node .avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:"Noto Serif SC",serif;font-weight:900;font-size:18px;color:#fff;border:3px solid var(--paper);box-shadow:0 4px 14px rgba(20,30,25,.28);transition:transform .15s, box-shadow .15s}
  .node .avatar img,.pcard .av img,.sresults .sav img,.big-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
  .node:hover .avatar,.node:focus-visible .avatar{transform:scale(1.09)}
  .node .pname{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(20,30,25,.08)}
  .node .ptag{font-size:10.5px;color:var(--muted);white-space:nowrap;margin-top:-3px}
  .node.center .avatar{width:60px;height:60px;font-size:23px;border-color:#e9d9a8;box-shadow:0 0 0 3px rgba(176,125,30,.35),0 6px 18px rgba(20,30,25,.3)}
  .node.center .pname{font-size:14px}
  .node.selected .avatar{box-shadow:0 0 0 4px #b07d1e,0 6px 18px rgba(20,30,25,.3)}
  .node.center.selected .avatar{box-shadow:0 0 0 4px #b07d1e,0 0 0 7px rgba(176,125,30,.35)}
  .node.dim{opacity:.28}
  .node:focus-visible{outline:3px solid var(--shitu);outline-offset:2px;border-radius:14px}
  @media(max-width:640px){
    .stage{aspect-ratio:580/760;min-height:0}
    .node .avatar{width:37px;height:37px;font-size:15px;border-width:2px}
    .node.center .avatar{width:47px;height:47px;font-size:19px}
    .node .pname{font-size:11px;padding:1px 7px}
    .node .ptag{display:none}
    .edge-label{font-size:13px}
  }

  /* ---------- Detail ---------- */
  .detail{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;display:grid;grid-template-columns:220px 1fr;gap:6px 26px}
  @media(max-width:700px){.detail{grid-template-columns:1fr}}
  .detail .who{display:flex;gap:14px;align-items:center}
  .detail .big-av{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Noto Serif SC",serif;font-weight:900;font-size:25px}
  .detail h3{margin:0;font-size:21px}
  .detail .role{font-size:13px;color:var(--muted)}
  .detail .bio{font-size:14px;color:var(--ink2);margin:8px 0 0;grid-column:1/-1}
  @media(min-width:701px){.detail .bio{grid-column:2}}
  .rel-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{display:inline-flex;gap:7px;align-items:center;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;border:1px solid transparent;background:var(--paper2);color:var(--ink)}
  .chip b{font-weight:800}
  .chip.xiayuan{background:var(--xiayuan-bg);color:var(--xiayuan);border-color:color-mix(in srgb,var(--xiayuan) 30%,transparent)}
  .chip.shitu{background:var(--shitu-bg);color:var(--shitu);border-color:color-mix(in srgb,var(--shitu) 30%,transparent)}
  .chip.jieyi{background:var(--jieyi-bg);color:var(--jieyi);border-color:color-mix(in srgb,var(--jieyi) 32%,transparent)}
  .chip .to{color:var(--ink)}

  /* ---------- Sections ---------- */
  section{margin-top:38px}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .sec-head h2{margin:0;font-size:23px;font-weight:900}
  .sec-head span{font-size:13px;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:820px){.cards{grid-template-columns:1fr}}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-top:5px solid var(--muted)}
  .rcard.xiayuan{border-top-color:var(--xiayuan)} .rcard.shitu{border-top-color:var(--shitu)} .rcard.jieyi{border-top-color:var(--jieyi)}
  .rcard h3{margin:0 0 2px;font-size:20px;display:flex;align-items:center;gap:9px}
  .rcard h3 .glyph{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;color:#fff;flex:none}
  .rcard.xiayuan .glyph{background:var(--xiayuan)} .rcard.shitu .glyph{background:var(--shitu)} .rcard.jieyi .glyph{background:var(--jieyi)}
  .rcard .en{font-size:12px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  .rcard p{font-size:14px;color:var(--ink2);margin:10px 0}
  .rcard ul{margin:0;padding:0;list-style:none;font-size:14px}
  .rcard li{padding:8px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
  .rcard li:first-child{border-top:none}
  .rcard li .who2{font-weight:700;white-space:nowrap}
  .rcard li .note{color:var(--muted);font-size:12.5px;text-align:right}

  .list-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .lrow{display:grid;grid-template-columns:86px 1fr auto;gap:8px 16px;align-items:center;padding:13px 20px;border-top:1px solid var(--line)}
  .lrow:first-child{border-top:none}
  .badge{justify-self:start;font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:999px}
  .badge.xiayuan{background:var(--xiayuan-bg);color:var(--xiayuan)} .badge.shitu{background:var(--shitu-bg);color:var(--shitu)} .badge.jieyi{background:var(--jieyi-bg);color:var(--jieyi)}
  .lrow .names{font-weight:700;font-size:15px}
  .lrow .desc{font-size:13px;color:var(--muted)}
  .lrow .arrow{color:var(--muted);font-size:13px;white-space:nowrap}
  @media(max-width:640px){.lrow{grid-template-columns:76px 1fr}.lrow .arrow{display:none}.lrow .desc{grid-column:2}}

  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:.15s;min-height:44px}
  @media(max-width:640px){
    /* 手机端名单：多列网格，自然换行，不限行数，显示头像 */
    .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));grid-auto-flow:row;gap:9px;overflow:visible;padding:2px}
    .pcard{padding:11px 4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .pcard .av{width:42px;height:42px;font-size:17px;margin:0 auto 5px}
    .pcard .n{font-size:14px;line-height:1.3;white-space:normal;word-break:break-all}
    .pcard:hover{transform:none}
  }
  .pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .pcard .av{width:48px;height:48px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Noto Serif SC",serif;font-weight:900;font-size:19px}
  .pcard .n{font-weight:800;font-size:15px}
  .pcard .t{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45}
  /* 全部名单：头像在上，全名在下 */
  #people .pcard .n{font-size:14.5px;line-height:1.4;word-break:break-all}
  /* 字母选择：只显示有的字母 */
  .letter-bar{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
  .letter-chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-width:34px;min-height:34px;padding:4px 10px;font-weight:700;font-size:14px;cursor:pointer}
  .letter-chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  /* 最近查看：单行横向滑动，一行 5 个，显示头像，自适应手机/PC */
  #recentViewed{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:2px 2px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  #recentViewed::-webkit-scrollbar{height:6px}
  #recentViewed::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
  #recentViewed::-webkit-scrollbar-track{background:transparent}
  #recentViewed .pcard{flex:0 0 calc(20% - 7px);min-width:0;background:transparent;border-color:transparent;padding:6px 2px;scroll-snap-align:start;display:block}
  #recentViewed .pcard .av{width:100%;max-width:84px;aspect-ratio:1;height:auto;margin:0 auto 6px;font-size:20px}
  #recentViewed .pcard .n{font-size:13.5px}

  footer{margin-top:44px;padding:18px 4px 0;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
  .vtext{writing-mode:vertical-rl;letter-spacing:.35em}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">

var isMobile = false;
/* 点开某人时：本人放中间，相关的人围成一圈；其他模式用固定坐标 */
var radialMap = {};
function radialPositions(){
  var map = {};
  if(mode!=="person" || !selected || !byId[selected]) return map;
  var W = isMobile ? 580 : 940, H = isMobile ? 760 : 580;
  var cx = W/2, cy = H/2;
  var neigh = relationsOf(selected).map(function(r){ return r.other; });
  var seen={}, list=[];
  neigh.forEach(function(id){ if(!seen[id]){ seen[id]=1; list.push(id); } });
  map[selected] = {x: cx, y: cy};
  var n = list.length;
  if(n===0) return map;
  var r = Math.max(isMobile?180:170, (n*100)/(2*Math.PI));
  r = Math.min(r, (Math.min(W,H)/2) - 70);
  list.forEach(function(id, i){
    var a = (i/n)*Math.PI*2 - Math.PI/2;
    map[id] = {x: Math.round(cx + r*Math.cos(a)), y: Math.round(cy + r*Math.sin(a))};
  });
  return map;
}
function pos(p){ if(radialMap[p.id]) return radialMap[p.id]; return isMobile ? {x:p.mx, y:p.my} : {x:p.x, y:p.y}; }
function midPoint(a,b,bend){
  var mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  var dx=b.x-a.x, dy=b.y-a.y, len=Math.sqrt(dx*dx+dy*dy)||1;
  return {x: mx + (-dy/len)*bend, y: my + (dx/len)*bend, cx: mx + (-dy/len)*bend*2, cy: my + (dx/len)*bend*2};
}

function layout(){
  var w = stage.clientWidth || window.innerWidth;
  var nextMobile = w < 640;
  var changed = nextMobile !== isMobile;
  isMobile = nextMobile;
  radialMap = radialPositions();
  var W = isMobile ? 580 : 940, H = isMobile ? 760 : 580;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  EDGES.forEach(function(e,idx){
    /* 直线：不给弯度 */
    var bend = 0;
    var a=pos(byId[e.from]), b=pos(byId[e.to]), m=midPoint(a,b,bend);
    var path=document.getElementById("edge-"+idx);
    if(path) path.setAttribute("d","M"+a.x+","+a.y+" Q"+m.cx+","+m.cy+" "+b.x+","+b.y);
    var lab=document.getElementById("edge-label-"+idx);
    if(lab){ lab.setAttribute("x", m.x); lab.setAttribute("y", m.y); }
  });
  PEOPLE.forEach(function(p){
    var pp=pos(p), el=nodeEls[p.id];
    el.style.left=(pp.x/W*100)+"%"; el.style.top=(pp.y/H*100)+"%";
  });
  return changed;
}

function relationsOf(id){
  var out=[];
  EDGES.forEach(function(e){
    if(e.type==="jieyi") return;
    if(e.from===id) out.push({type:e.type, other:e.to, dir:"out"});
    else if(e.to===id) out.push({type:e.type, other:e.from, dir:"in"});
  });
  JIEYI_GROUPS.forEach(function(g){
    if(g.indexOf(id)>-1){
      g.forEach(function(other){
        if(other!==id) out.push({type:"jieyi", other:other, dir:"out"});
      });
    }
  });
  // 结义去重：同一人只列一次
  var seen={}, res=[];
  out.forEach(function(r){
    var k=r.type+"|"+r.other;
    if(!seen[k]){ seen[k]=1; res.push(r); }
  });
  return res;
}
function relText(r, me){
  var other=byId[r.other].name;
  if(r.type==="xiayuan") return "与 "+other+" 结为侠缘";
  if(r.type==="jieyi") return "与 "+other+" 结义";
  return r.dir==="out" ? ("师父 —— 徒弟是 "+other) : ("徒弟 —— 师父是 "+other);
}
function visibleSet(){
  var s={};
  if(mode==="all"){
    PEOPLE.forEach(function(p){ s[p.id]=1; });
  } else if(mode==="type"){
    EDGES.forEach(function(e){ if(e.type===filter){ s[e.from]=1; s[e.to]=1; } });
  } else if(mode==="person" && selected){
    s[selected]=1;
    relationsOf(selected).forEach(function(r){
      if(filter==="all" || r.type===filter) s[r.other]=1;
    });
  }
  return s;
}
function updateFocusLabel(){
  document.getElementById("focusLabel").textContent="";
}
function applyVisual(){
  var vis=visibleSet();
  document.querySelectorAll(".edge,.edge-label").forEach(function(el){
    var both = vis[el.dataset.from] && vis[el.dataset.to];
    var typeOk = (filter==="all") || el.dataset.type===filter;
    /* 结义不画成员之间的连线，只画与选中人相连的，不然成团的虚线太乱 */
    var jieyiOk = el.dataset.type!=="jieyi" || !selected || el.dataset.from===selected || el.dataset.to===selected;
    var show = !!(both && typeOk && jieyiOk);
    el.style.display = show ? "" : "none";
    if(!show) return;
    var touches = selected && (el.dataset.from===selected || el.dataset.to===selected);
    el.classList.toggle("hl", mode==="person" && !!touches);
    /* 邻居之间的线淡一点，但还能看清 */
    el.classList.toggle("dim", mode==="person" && !touches);
  });
  document.querySelectorAll(".node").forEach(function(n){
    var id=n.dataset.id;
    n.style.display = vis[id] ? "" : "none";
    n.classList.toggle("dim", false);
    n.classList.toggle("selected", id===selected && mode!=="type");
  });
  updateFocusLabel();
}
function renderDetail(id){
  var p=byId[id];
  var rels=relationsOf(id);
  var chips=rels.map(function(r){
    return '<span class="chip '+r.type+'"><b>'+TYPE_NAME[r.type]+'</b><span class="to">'+relText(r,id)+'</span></span>';
  }).join("");
  detailEl.innerHTML =
    '<div class="who"><span class="big-av" style="background:'+p.color+'">'+avInner(p)+'</span><div><h3 class="serif">'+p.name+'</h3></div></div>'
    + '<div><div class="rel-chips">'+chips+'</div></div>';
}
function selectPerson(id){
  selected=id;
  renderDetail(id);
  applyVisual();
}
function setFilterUI(){
  document.querySelectorAll(".fbtn").forEach(function(x){ x.setAttribute("aria-pressed", x.dataset.f===filter ? "true":"false"); });
}
function showGraph(){

}
document.querySelectorAll(".fbtn").forEach(function(b){
  b.addEventListener("click",function(){
    filter=b.dataset.f;
    setFilterUI();
    /* 只在当前人物的关系网里按类型筛，不跳到全站的类型视图 */
    if(selected){ mode="person"; renderDetail(selected); }

/* ---------- 最近查看：存在本机浏览器里，最多留 5 个 ---------- */
var RECENT_KEY = "yanyun_recent_viewed";
function getRecentViewed(){
  try{ var arr = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); return Array.isArray(arr) ? arr : []; }
  catch(e){ return []; }
}
function recordViewed(id){
  var list = getRecentViewed().filter(function(x){ return x !== id; });
  list.unshift(id);
  list = list.slice(0, 5);
  try{ localStorage.setItem(RECENT_KEY, JSON.stringify(list)); }catch(e){}
  renderRecentViewed();
}
function renderRecentViewed(){
  var box = document.getElementById("recentViewed");
  if(!box) return;
  var list = getRecentViewed();
  var items = [];
  list.forEach(function(id){
    var p = null;
    PEOPLE.forEach(function(x){ if(x.id === id) p = x; });
    if(p) items.push(p);
  });
  if(items.length === 0){
    box.innerHTML = '<div style="grid-column:1/-1;color:var(--muted);font-size:13px;padding:6px 2px">还没有查看过，点开一个人就会出现在这里</div>';
    return;
  }
  box.innerHTML = items.map(function(p){
    return '<div class="pcard" role="button" tabindex="0" data-pid="'+p.id+'"><div class="av" style="background:'+p.color+'">'+avInner(p)+'</div><div class="n">'+p.name+'</div></div>';
  }).join("");
  box.querySelectorAll(".pcard").forEach(function(c){
    function go(){ openPerson(c.dataset.pid, true); }
    c.addEventListener("click", go);
    c.addEventListener("keydown", function(ev){ if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); go(); } });
  });
}

/* ---------- 打开某个人的关系图：只显示与他有关的人 ---------- */
function openPerson(id, scroll){
  selected=id;
  recordViewed(id);
  filter="all"; setFilterUI();
  mode="person";
  document.getElementById("typeFilters").style.display="";
  showGraph();
  renderDetail(id);
  applyVisual();
  fitView(true);
  var el=nodeEls[id];
  if(el){ el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
  if(scroll) graphCard.scrollIntoView({behavior:"smooth", block:"start"});
}

  document.getElementById("people").scrollIntoView({behavior:"smooth", block:"start"});
});

/* ---------- 缩放 / 平移 ---------- */
var view={k:1,x:0,y:0};
var zoomVal=document.getElementById("zoomVal");
function applyView(anim){
  world.classList.toggle("anim", !!anim);
  world.style.transform="translate("+view.x+"px,"+view.y+"px) scale("+view.k+")";
  zoomVal.textContent=Math.round(view.k*100)+"%";
  stage.classList.toggle("zoom-out", view.k<0.8);
  if(anim) setTimeout(function(){ world.classList.remove("anim"); },480);
}
function clampK(k){ return Math.min(3, Math.max(0.3, k)); }
function zoomAt(px,py,factor,anim){
  var wx=(px-view.x)/view.k, wy=(py-view.y)/view.k;
  view.k=clampK(view.k*factor);
  view.x=px-wx*view.k; view.y=py-wy*view.k;
  applyView(anim);
}
function fitView(anim){
  var vis=visibleSet(); var ids=Object.keys(vis);
  var sw=stage.clientWidth, sh=stage.clientHeight;
  if(!ids.length || !sw || !sh) return;
  var W=isMobile?580:940, H=isMobile?760:580;
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  ids.forEach(function(id){
    var pp=pos(byId[id]); var fx=pp.x/W, fy=pp.y/H;
    if(fx<minx)minx=fx; if(fx>maxx)maxx=fx;
    if(fy<miny)miny=fy; if(fy>maxy)maxy=fy;
  });
  var bw=Math.max((maxx-minx)*sw,150), bh=Math.max((maxy-miny)*sh,150);
  var shU=Math.max(sh-84, 200); /* 底部留出缩放条的高度，节点和名字不压到缩放条下面 */
  view.k=Math.min(2.1, Math.max(0.32, Math.min(sw/(bw+120), shU/(bh+150))));
  view.x=sw/2-((minx+maxx)/2)*sw*view.k;
  view.y=shU/2-((miny+maxy)/2)*sh*view.k;
  applyView(anim);
}
stage.addEventListener("wheel",function(e){
  if(mode==="roster") return;
  e.preventDefault();
  var r=stage.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.12:0.89, false);
},{passive:false});
var pointers={}, panStart=null, pinchStart=null;
function stagePoint(e){ var r=stage.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
stage.addEventListener("pointerdown",function(e){
  if(e.target.closest && (e.target.closest(".node") || e.target.closest(".zoomctl"))) return;
  pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  var n=Object.keys(pointers).length;
  if(n===1){
    panStart={cx:e.clientX, cy:e.clientY, vx:view.x, vy:view.y};
    stage.classList.add("panning");
  } else if(n===2){
    var pts=Object.keys(pointers).map(function(k){ return pointers[k]; });
    var mx=(pts[0].x+pts[1].x)/2, my=(pts[0].y+pts[1].y)/2;
    var r=stage.getBoundingClientRect();
    pinchStart={ dist:Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y)||1,
      wx:((mx-r.left)-view.x)/view.k, wy:((my-r.top)-view.y)/view.k, k:view.k };
    panStart=null;
  }
});
stage.addEventListener("pointermove",function(e){
  if(!pointers[e.pointerId]) return;
  pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  var n=Object.keys(pointers).length;
  if(n===1 && panStart){
    view.x=panStart.vx+(e.clientX-panStart.cx);
    view.y=panStart.vy+(e.clientY-panStart.cy);
    applyView(false);
  } else if(n===2 && pinchStart){
    var pts=Object.keys(pointers).map(function(k){ return pointers[k]; });
    var mx=(pts[0].x+pts[1].x)/2, my=(pts[0].y+pts[1].y)/2;
    var dist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y)||1;
    var r=stage.getBoundingClientRect();
    view.k=clampK(pinchStart.k*dist/pinchStart.dist);
    view.x=(mx-r.left)-pinchStart.wx*view.k;
    view.y=(my-r.top)-pinchStart.wy*view.k;
    applyView(false);
  }
});
function endPointer(e){
  delete pointers[e.pointerId];
  if(!Object.keys(pointers).length){ stage.classList.remove("panning"); panStart=null; pinchStart=null; }
}
stage.addEventListener("pointerup",endPointer);
stage.addEventListener("pointercancel",endPointer);
document.getElementById("zoomIn").addEventListener("click",function(){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.3, true); });
document.getElementById("zoomOut").addEventListener("click",function(){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, 0.77, true); });
document.getElementById("zoomFit").addEventListener("click",function(){ fitView(true); });
stage.addEventListener("dblclick",function(e){
  if(e.target.closest && e.target.closest(".node")) return;
  fitView(true);
});

/* ---------- 搜索：过滤名单 + 下拉定位 ---------- */
var searchInput=document.getElementById("searchInput");
var searchRow=document.getElementById("searchRow");
var searchResults=document.getElementById("searchResults");
function matchesFor(q){
  if(!q) return [];
  return PEOPLE.filter(function(p){ return p.name.indexOf(q)>-1 || p.role.indexOf(q)>-1 || p.tag.indexOf(q)>-1; });
}
function renderSearchDropdown(){
  var q=searchInput.value.trim();
  var list=matchesFor(q);
  if(!q){ searchResults.classList.remove("open"); searchResults.innerHTML=""; return; }
  if(!list.length){
    searchResults.innerHTML='<div class="none">没找到「'+q+'」</div>';
  } else {
    searchResults.innerHTML=list.slice(0,8).map(function(p){
      return '<button type="button" role="option" data-sid="'+p.id+'"><span class="sav" style="background:'+p.color+'">'+avInner(p)+'</span>'+p.name+'</button>';
    }).join("");
    searchResults.querySelectorAll("button[data-sid]").forEach(function(b){
      b.addEventListener("click",function(){
        searchResults.classList.remove("open");
        openPerson(b.dataset.sid,true);
      });
    });
  }
  searchResults.classList.add("open");
}
function filterRoster(){
  var q=searchInput.value.trim();
  searchRow.classList.toggle("hasq", !!q);
  document.querySelectorAll("#people .pcard").forEach(function(c){
    var p=byId[c.dataset.pid];
    var hit=!q || p.name.indexOf(q)>-1 || p.role.indexOf(q)>-1 || p.tag.indexOf(q)>-1;
    var hitLetter = !letterFilter || pinyinInitial(p.name.charAt(0)) === letterFilter;
    c.classList.toggle("hidden-by-search", !(hit && hitLetter));
  });
}
searchInput.addEventListener("input",function(){ filterRoster(); renderSearchDropdown(); });
searchInput.addEventListener("focus",renderSearchDropdown);
searchInput.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    var list=matchesFor(searchInput.value.trim());
    if(list.length){ searchResults.classList.remove("open"); openPerson(list[0].id,true); }
  } else if(e.key==="Escape"){
    searchResults.classList.remove("open");
  }
});
document.getElementById("searchClear").addEventListener("click",function(){
  searchInput.value=""; filterRoster(); renderSearchDropdown(); searchInput.focus();
});
document.addEventListener("click",function(e){
  if(!searchRow.contains(e.target)) searchResults.classList.remove("open");
});

/* ---------- 初始化：数据加载后在 buildDataViews 里做 ---------- */
var resizeTimer=null;
window.addEventListener("resize",function(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(function(){
    var changed=layout();
    if(changed && mode!=="roster"){ applyVisual(); fitView(false); }
  },120);
});

/* ================= 接口取数 + 数据驱动渲染 ================= */
function autoColor(id){
  var hue = ((id||0) * 137.508) % 360;
  return "hsl(" + Math.round(hue) + ", 42%, 38%)";
}
/* 头像：有上传的头像就显示图片，没有就显示姓氏字（不做默认图） */
function avInner(p){
  if (p.avatar) return '<img src="/yanyun/avatars/' + p.avatar + '" alt="" loading="lazy" />';
  return p.surname;
}
/* 姓氏首字的拼音首字母：用每字母排第一的字做边界比较 */
var PINYIN_BOUNDARIES = [
  ['A','阿'],['B','八'],['C','擦'],['D','搭'],['E','鹅'],['F','发'],['G','噶'],
  ['H','哈'],['J','击'],['K','喀'],['L','垃'],['M','妈'],['N','拿'],['O','哦'],
  ['P','趴'],['Q','期'],['R','然'],['S','撒'],['T','他'],['W','挖'],['X','西'],
  ['Y','压'],['Z','杂']
];
function pinyinInitial(ch){
  for (var i = PINYIN_BOUNDARIES.length - 1; i >= 0; i--) {
    if (ch.localeCompare(PINYIN_BOUNDARIES[i][1], 'zh') >= 0) return PINYIN_BOUNDARIES[i][0];
  }
  return '#';
}
var letterFilter = '';
function renderLetterBar(){
  var bar = document.getElementById('letterBar');
  if (!bar) return;
  var seen = {}, letters = [];
  ROSTER.forEach(function(p){
    var L = pinyinInitial(p.name.charAt(0));
    if (L !== '#' && !seen[L]) { seen[L] = 1; letters.push(L); }
  });
  letters.sort();
  var html = '<button class="letter-chip' + (letterFilter === '' ? ' on' : '') + '" data-l="">全部</button>';
  html += letters.map(function(L){
    return '<button class="letter-chip' + (letterFilter === L ? ' on' : '') + '" data-l="' + L + '">' + L + '</button>';
  }).join('');
  bar.innerHTML = html;
  bar.querySelectorAll('.letter-chip').forEach(function(b){
    b.addEventListener('click', function(){
      letterFilter = b.dataset.l || '';
      renderLetterBar();
      filterRoster();
    });
  });
}
function mapApiData(d){
  var byInt = {};
  var people = (d.people||[]).map(function(p){
    var pid = p.pid || ("p"+p.id);
    byInt[p.id] = pid;
    var auto = (p.x==null || p.y==null);
    return {
      id: pid,
      num: p.id,
      name: p.name||"",
      surname: p.surname || (p.name ? p.name.charAt(0) : "?"),
      color: p.color || autoColor(p.id),
      avatar: p.avatar || "",
      x: (p.x==null?462:p.x), y: (p.y==null?342:p.y),
      mx: (p.mx==null?285:p.mx), my: (p.my==null?448:p.my),
      tag: p.tag||"", role: p.role||"", center: !!p.center, bio: p.bio||"",
      _auto: auto
    };
  });
  /* 没有坐标的人按圆环排开，避免全部叠在同一个默认点上 */
  var autos = people.filter(function(p){ return p._auto; });
  autos.forEach(function(p, i){
    var a = (i / autos.length) * Math.PI * 2 - Math.PI/2;
    p.x = Math.round(470 + 370*Math.cos(a));
    p.y = Math.round(290 + 215*Math.sin(a));
    p.mx = Math.round(290 + 225*Math.cos(a));
    p.my = Math.round(380 + 290*Math.sin(a));
  });
  var edges = (d.relationships||[]).map(function(r){
    return { from: byInt[r.from_id], to: byInt[r.to_id], type: r.type, label: r.label||"", bend: (r.bend==null?0:r.bend) };
  }).filter(function(e){ return e.from && e.to; });
  return {people: people, edges: edges};
}
function deriveJieyiGroups(edges){
  var adj = {};
  edges.forEach(function(e){
    if(e.type!=="jieyi") return;
    (adj[e.from]=adj[e.from]||[]).push(e.to);
    (adj[e.to]=adj[e.to]||[]).push(e.from);
  });
  var seen={}, groups=[];
  Object.keys(adj).forEach(function(start){
    if(seen[start]) return;
    var stack=[start], comp=[]; seen[start]=1;
    while(stack.length){
      var n=stack.pop(); comp.push(n);
      (adj[n]||[]).forEach(function(mm){ if(!seen[mm]){ seen[mm]=1; stack.push(mm); } });
    }
    if(comp.length>1) groups.push(comp);
  });
  return groups;
}
function buildRelList(edges){
  var out=[];
  edges.forEach(function(e){
    var a=byId[e.from], b=byId[e.to];
    if(!a||!b) return;
    if(e.type==="xiayuan") out.push({type:"xiayuan", badge:"侠缘", names:a.name+" ♥ "+b.name, desc:"", arrow:"一对一"});
    else if(e.type==="shitu") out.push({type:"shitu", badge:"师徒", names:a.name+" → "+b.name, desc:"", arrow:"师父 → 徒弟"});
  });
  deriveJieyiGroups(edges).forEach(function(g){
    out.push({type:"jieyi", badge:"结义", names:g.map(function(id){ return byId[id].name; }).join(" · "), desc:"", arrow:"多人成盟"});
  });
  return out;
}
function buildDataViews(people, edges, groups, relList){
  PEOPLE = people; EDGES = edges;
  byId = {}; PEOPLE.forEach(function(p){ byId[p.id]=p; });
  /* 收录名单按拼音排序：用中文 locale 按拼音排，先比姓氏、同姓再比全名 */
  ROSTER = PEOPLE.slice().sort(function(a,b){
    return a.name.localeCompare(b.name, 'zh');
  });
  JIEYI_GROUPS = groups || deriveJieyiGroups(EDGES);
  REL_LIST = relList || buildRelList(EDGES);
  svg.querySelectorAll(".edge,.edge-label").forEach(function(el){ el.remove(); });
  EDGES.forEach(function(e,idx){
    var path=document.createElementNS(NS,"path");
    path.setAttribute("class","edge "+e.type);
    path.dataset.type=e.type; path.dataset.from=e.from; path.dataset.to=e.to; path.id="edge-"+idx;
    if(e.type==="shitu"){
      path.setAttribute("marker-end","url(#arr-shitu)");
      /* 师徒线跟师傅的头像色走，不同师傅的线颜色不同，好分辨 */
      if(byId[e.from] && byId[e.from].color) path.style.stroke = byId[e.from].color;
    }
    svg.appendChild(path);
    var lab=document.createElementNS(NS,"text");
    lab.setAttribute("class","edge-label "+e.type);
    lab.dataset.type=e.type; lab.dataset.from=e.from; lab.dataset.to=e.to; lab.id="edge-label-"+idx;
    lab.setAttribute("text-anchor","middle");
    lab.textContent=TYPE_NAME[e.type]||e.type;
    svg.appendChild(lab);
  });
  nodeEls = {};
  world.querySelectorAll(".node").forEach(function(el){ el.remove(); });
  PEOPLE.forEach(function(p){
    var btn=document.createElement("button");
    btn.type="button"; btn.className="node"+(p.center?" center":"");
    btn.dataset.id=p.id;
    btn.setAttribute("aria-label","查看 "+p.name+" 的关系");
    btn.innerHTML='<span class="avatar" style="background:'+p.color+'">'+avInner(p)+'</span><span class="pname">'+p.name+'</span>';
    btn.addEventListener("click",function(){ openPerson(p.id,false); });
    world.appendChild(btn);
    nodeEls[p.id]=btn;
  });
  document.getElementById("rosterTitle").textContent = "收录名单（" + PEOPLE.length + "人）";
  renderRecentViewed();
  renderLetterBar();
  document.getElementById("people").innerHTML = ROSTER.map(function(p){
    return '<div class="pcard" role="button" tabindex="0" data-pid="'+p.id+'"><div class="av" style="background:'+p.color+'">'+avInner(p)+'</div><div class="n">'+p.name+'</div></div>';
  }).join("");
  document.querySelectorAll("#people .pcard").forEach(function(c){
    function go(){ openPerson(c.dataset.pid,true); }
    c.addEventListener("click",go);
    c.addEventListener("keydown",function(ev){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); go(); } });
  });
  filterRoster();
  layout();
  applyView(false);
}
/* 先只显示名单，关系图不打开；数据来自接口，接口失败才用页面内置示例 */
fetch("/yanyun/api/data?v="+Date.now(), {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
  .then(function(d){
    var m = mapApiData(d);
    buildDataViews(m.people, m.edges, null, null);
  })
  .catch(function(){
    buildDataViews(FALLBACK_PEOPLE, FALLBACK_EDGES, JIEYI_GROUPS_FALLBACK, REL_LIST_FALLBACK);
  });
</script>
